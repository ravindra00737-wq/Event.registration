<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vote | Employee of the Month</title>
<style>
:root{--brand:#6d3063;--brand-light:#8b4f82;--bg:#f5f2f6;--card:#fff;--text:#333;--border:#e0d8e0;--bg-img:none;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Book Antiqua',serif;background:var(--bg);background-image:var(--bg-img);background-size:cover;background-attachment:fixed;background-position:center;color:var(--text);min-height:100vh;}
.hdr{text-align:center;padding:30px 20px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:3px solid var(--brand);}
.hdr.centered{display:flex;flex-direction:column;align-items:center;}
.hdr.left{display:flex;align-items:center;gap:20px;text-align:left;padding:25px 40px;flex-wrap:wrap;}
.hdr.banner{background:linear-gradient(135deg,var(--brand),var(--brand-light));color:#fff;padding:40px 20px;}
.hdr.banner .sub{color:rgba(255,255,255,.9);}
.hdr img.logo{max-height:80px;max-width:180px;margin-bottom:10px;}
.hdr.left img.logo{margin:0;}
.hdr h1{font-size:2rem;color:var(--brand);letter-spacing:.5px;}
.hdr.banner h1{color:#fff;}
.hdr .sub{color:#777;font-size:1.05rem;margin-top:5px;}
.hdr .period{display:inline-block;margin-top:10px;padding:6px 16px;background:var(--brand);color:#fff;border-radius:20px;font-weight:bold;font-size:.9rem;}
.container{max-width:1200px;margin:25px auto;padding:0 20px;}
.step{display:none;animation:fade .4s;}
.step.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.welcome{max-width:500px;margin:40px auto;background:var(--card);padding:35px;border-radius:14px;box-shadow:0 8px 25px rgba(109,48,99,.12);}
.welcome h2{color:var(--brand);margin-bottom:18px;text-align:center;}
label{display:block;margin:12px 0 6px;font-weight:bold;color:#555;}
input[type=text],select{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:7px;font-family:inherit;font-size:1rem;background:#fff;}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(109,48,99,.1);}
.btn{background:var(--brand);color:#fff;border:none;padding:12px 26px;border-radius:7px;cursor:pointer;font-family:inherit;font-weight:bold;font-size:1rem;transition:.25s;display:inline-flex;align-items:center;gap:7px;}
.btn:hover{background:var(--brand-light);transform:translateY(-2px);box-shadow:0 6px 14px rgba(109,48,99,.3);}
.btn-full{width:100%;justify-content:center;margin-top:18px;padding:14px;font-size:1.1rem;}
.btn-outline{background:transparent;color:var(--brand);border:2px solid var(--brand);}
.btn-outline:hover{background:var(--brand);color:#fff;}
.btn-success{background:#2e7d32;}
.btn-success:hover{background:#388e3c;}
.cat-tabs{display:flex;gap:8px;margin-bottom:25px;flex-wrap:wrap;border-bottom:2px solid var(--border);padding-bottom:0;}
.cat-tab{padding:12px 22px;background:#f0e8f0;color:var(--brand);border:none;border-radius:8px 8px 0 0;cursor:pointer;font-family:inherit;font-weight:bold;font-size:.95rem;transition:.2s;position:relative;bottom:-2px;border-bottom:3px solid transparent;}
.cat-tab:hover{background:#e5d5e5;}
.cat-tab.active{background:var(--brand);color:#fff;border-bottom-color:var(--brand);}
.cat-tab .count{background:rgba(255,255,255,.3);padding:2px 7px;border-radius:10px;font-size:.75rem;margin-left:6px;}
.cat-tab.active .count{background:rgba(255,255,255,.35);}
.nom-grid{display:grid;gap:22px;}
.nom-grid.grid-style{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));}
.nom-grid.list-style{grid-template-columns:1fr;}
.nom-card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 6px 18px rgba(109,48,99,.1);transition:.3s;display:flex;flex-direction:column;}
.nom-grid.list-style .nom-card{flex-direction:row;}
.nom-card:hover{transform:translateY(-4px);box-shadow:0 10px 25px rgba(109,48,99,.18);}
.nom-card img{width:100%;height:240px;object-fit:cover;background:#eee;}
.nom-grid.list-style .nom-card img{width:200px;height:auto;min-height:200px;flex-shrink:0;}
.nom-info{padding:20px;flex:1;display:flex;flex-direction:column;}
.nom-info.left{text-align:left;}
.nom-info.center{text-align:center;}
.nom-info h3{color:var(--brand);font-size:1.35rem;margin-bottom:8px;}
.nom-meta{font-size:.88rem;color:#666;margin-bottom:10px;line-height:1.6;}
.nom-meta strong{color:var(--brand);}
.nom-desc{font-size:.95rem;line-height:1.55;margin-bottom:15px;flex:1;color:#555;}
.rating-box{display:flex;align-items:center;gap:10px;padding:12px;background:#faf7fa;border-radius:8px;margin-top:auto;}
.rating-box label{margin:0;color:var(--brand);white-space:nowrap;font-size:.95rem;}
.rating-box input{width:70px;padding:8px;text-align:center;font-size:1.15rem;font-weight:bold;color:var(--brand);border:2px solid var(--border);border-radius:6px;font-family:inherit;background:#fff;}
.rating-box input:focus{border-color:var(--brand);outline:none;}
.rating-box input.invalid{border-color:#c0392b;background:#fdecea;}
.progress-bar{background:#e0d8e0;height:8px;border-radius:4px;overflow:hidden;margin:15px 0;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-light));transition:width .4s;border-radius:4px;}
.progress-text{font-size:.88rem;color:#666;text-align:center;}
.alert{padding:13px 18px;border-radius:8px;margin-bottom:15px;display:none;font-weight:500;animation:fade .3s;}
.alert-success{background:#d4edda;color:#155724;border:1px solid #a3d9b1;}
.alert-error{background:#f8d7da;color:#721c24;border:1px solid #f1aeb5;}
.complete{text-align:center;max-width:600px;margin:40px auto;background:var(--card);padding:40px;border-radius:14px;box-shadow:0 8px 25px rgba(109,48,99,.12);}
.complete .icon{font-size:4rem;margin-bottom:15px;}
.complete h2{color:var(--brand);margin-bottom:10px;}
.complete p{color:#666;margin-bottom:20px;line-height:1.6;}
</style>
</head>
<body>
<div id="main-app">
  <div class="hdr centered" id="app-header">
    <h1 id="h-title">Employee of the Month</h1>
    <div class="sub" id="h-hotel">Grand Plaza Hotel</div>
    <div class="period" id="h-period">July 2026</div>
  </div>
  <div class="container">
    <div id="alert-success" class="alert alert-success"></div>
    <div id="alert-error" class="alert alert-error"></div>
    <div id="step-info" class="step active">
      <div class="welcome">
        <h2>Welcome, Voter!</h2>
        <p style="text-align:center;color:#777;margin-bottom:15px;">Please enter your details to begin voting.</p>
        <label>Your Full Name</label>
        <input type="text" id="v-name" placeholder="e.g., John Smith">
        <label>Your Department</label>
        <input type="text" id="v-dept" placeholder="e.g., Front Office">
        <button class="btn btn-full" onclick="startVoting()">Start Voting →</button>
      </div>
    </div>
    <div id="step-vote" class="step">
      <div style="background:var(--card);padding:20px;border-radius:12px;box-shadow:0 4px 14px rgba(109,48,99,.08);">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px;">
          <div><strong style="color:var(--brand);">Voting as:</strong> <span id="v-display"></span></div>
          <div class="progress-text" id="progress-text">0 of 0 rated</div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        <div class="cat-tabs" id="cat-tabs"></div>
        <div id="cat-panels"></div>
        <button class="btn btn-success btn-full" onclick="submitAll()">✅ Submit All Votes</button>
      </div>
    </div>
    <div id="step-done" class="step">
      <div class="complete">
        <div class="icon">🎉</div>
        <h2>Thank You!</h2>
        <p>Your votes have been recorded successfully.<br>Please download your result file and send it back to the administrator.</p>
        <button class="btn btn-success btn-full" onclick="downloadResult()">📥 Download My Results</button>
        <button class="btn btn-outline btn-full" onclick="resetVoter()">🔄 Vote Again (New Voter)</button>
      </div>
    </div>
  </div>
</div>
<script>
// SAMPLE DATA - Replace with your own by using admin.html "Generate Voter File" button
const DATA = {
  hotel: { name: "Grand Plaza Hotel", logo: "" },
  period: { month: "July", year: 2026 },
  theme: { font: "'Book Antiqua', serif", color: "rgb(109, 48, 99)", bg: "", bgUrl: "" },
  layout: { cardStyle: "grid", imgPos: "top", align: "left", showNomBy: true, showDesc: true, showDept: true, headerStyle: "centered" },
  categories: [
    { id: 1, name: "Customer Service" },
    { id: 2, name: "Team Player" }
  ],
  nominees: [
    { id: 101, categoryId: 1, name: "Sarah Johnson", dept: "Front Desk", by: "Michael Brown", desc: "Consistently receives outstanding guest feedback and goes above and beyond to ensure guest satisfaction.", image: "" },
    { id: 102, categoryId: 1, name: "David Lee", dept: "Concierge", by: "Emma Wilson", desc: "Exceptional problem-solving skills and always maintains a positive attitude under pressure.", image: "" },
    { id: 103, categoryId: 2, name: "Maria Garcia", dept: "Housekeeping", by: "James Taylor", desc: "Always willing to help colleagues and maintains excellent teamwork across departments.", image: "" },
    { id: 104, categoryId: 2, name: "Robert Chen", dept: "Food & Beverage", by: "Lisa Anderson", desc: "Supports team members and contributes to a positive work environment.", image: "" }
  ]
};

let voter={name:'',dept:''};
let votes={};

function showAlert(m,t){const e=document.getElementById('alert-'+t);e.innerText=m;e.style.display='block';setTimeout(()=>e.style.display='none',3500);}

function adjustColor(hex,amt){let c=hex.replace('rgb(','').replace(')','').split(',').map(x=>parseInt(x.trim()));if(c.length!==3)return hex;return 'rgb('+Math.min(255,c[0]+amt)+','+Math.min(255,c[1]+amt)+','+Math.min(255,c[2]+amt)+')';}

function applyTheme(){
  document.documentElement.style.setProperty('--brand',DATA.theme.color);
  document.documentElement.style.setProperty('--brand-light',adjustColor(DATA.theme.color,20));
  document.body.style.fontFamily=DATA.theme.font;
  if(DATA.theme.bg)document.body.style.backgroundImage="url('"+DATA.theme.bg+"')";
  else if(DATA.theme.bgUrl)document.body.style.backgroundImage="url('"+DATA.theme.bgUrl+"')";
  else document.body.style.backgroundImage='none';
  const hdr=document.getElementById('app-header');
  hdr.className='hdr '+(DATA.layout.headerStyle||'centered');
  if(DATA.hotel.logo){document.getElementById('h-logo').src=DATA.hotel.logo;document.getElementById('h-logo').style.display='block';}
  document.getElementById('h-hotel').innerText=DATA.hotel.name||'';
  document.getElementById('h-period').innerText=DATA.period.month+' '+DATA.period.year;
}

function startVoting(){
  voter.name=document.getElementById('v-name').value.trim();
  voter.dept=document.getElementById('v-dept').value.trim();
  if(!voter.name||!voter.dept)return showAlert('Please fill both fields.','error');
  document.getElementById('v-display').innerText=voter.name+' ('+voter.dept+')';
  votes={};DATA.categories.forEach(c=>votes[c.id]={});
  renderVoting();
  document.getElementById('step-info').classList.remove('active');
  document.getElementById('step-vote').classList.add('active');
}

function renderVoting(){
  const L=DATA.layout;
  document.getElementById('cat-tabs').innerHTML=DATA.categories.map((c,i)=>{
    const noms=DATA.nominees.filter(n=>n.categoryId===c.id);
    return '<button class="cat-tab '+(i===0?'active':'')+'" onclick="showCat('+c.id+',this)">'+c.name+'<span class="count">'+noms.length+'</span></button>';
  }).join('');
  document.getElementById('cat-panels').innerHTML=DATA.categories.map((c,i)=>{
    const noms=DATA.nominees.filter(n=>n.categoryId===c.id);
    if(noms.length===0)return '<div class="cat-panel" data-cat="'+c.id+'" style="display:'+(i===0?'block':'none')+'"><p style="text-align:center;padding:30px;color:#888;">No nominees in this category.</p></div>';
    return '<div class="cat-panel" data-cat="'+c.id+'" style="display:'+(i===0?'block':'none')+'"><div class="nom-grid '+(L.cardStyle==='list'?'list-style':'grid-style')+'">'+noms.map(n=>renderCard(n,L)).join('')+'</div></div>';
  }).join('');
  updateProgress();
  document.querySelectorAll('.rate-input').forEach(inp=>{
    inp.oninput=function(){
      const cid=parseInt(this.dataset.cat),nid=parseInt(this.dataset.nom);
      const v=parseInt(this.value);
      if(this.value===''||(!isNaN(v)&&v>=1&&v<=10)){
        this.classList.remove('invalid');
        if(this.value==='')delete votes[cid][nid];else votes[cid][nid]=v;
        updateProgress();
      }else{this.classList.add('invalid');}
    };
  });
}

function renderCard(n,L){
  const img=n.image||'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="240"><rect fill="%23ddd" width="300" height="240"/><text x="50%25" y="50%25" fill="%23999" font-size="20" text-anchor="middle" dy=".3em">No Image</text></svg>';
  return '<div class="nom-card"><img src="'+img+'" alt="'+n.name+'"><div class="nom-info '+(L.align||'left')+'"><h3>'+n.name+'</h3><div class="nom-meta">'+(L.showDept!==false?'<div><strong>Department:</strong> '+n.dept+'</div>':'')+(L.showNomBy!==false?'<div><strong>Nominated by:</strong> '+n.by+'</div>':'')+'</div>'+(L.showDesc!==false?'<p class="nom-desc">'+n.desc+'</p>':'')+'<div class="rating-box"><label>Your Rating (1-10):</label><input type="number" min="1" max="10" class="rate-input" data-cat="'+n.categoryId+'" data-nom="'+n.id+'" placeholder="—"></div></div></div>';
}

function showCat(id,btn){
  document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.cat-panel').forEach(p=>p.style.display=p.dataset.cat==id?'block':'none');
}

function updateProgress(){
  const total=DATA.nominees.length;let done=0;
  Object.values(votes).forEach(c=>done+=Object.keys(c).length);
  document.getElementById('progress-text').innerText=done+' of '+total+' rated';
  document.getElementById('progress-fill').style.width=(total?done/total*100:0)+'%';
}

function submitAll(){
  let missing=0;
  DATA.categories.forEach(c=>{DATA.nominees.filter(n=>n.categoryId===c.id).forEach(n=>{if(!votes[c.id][n.id])missing++;});});
  if(missing>0)return showAlert('Please rate all nominees. '+missing+' rating(s) missing.','error');
  document.getElementById('step-vote').classList.remove('active');
  document.getElementById('step-done').classList.add('active');
  showAlert('Votes submitted successfully!','success');
}

function downloadResult(){
  const result={voterName:voter.name,voterDept:voter.dept,timestamp:new Date().toISOString(),period:DATA.period.month+' '+DATA.period.year,hotel:DATA.hotel.name,votes:votes};
  const blob=new Blob([JSON.stringify(result,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  const date=new Date().toISOString().slice(0,10);
  a.download='vote_'+voter.name.replace(/\s+/g,'_')+'_'+date+'.json';
  a.click();
}

function resetVoter(){
  voter={name:'',dept:''};votes={};
  document.getElementById('v-name').value='';document.getElementById('v-dept').value='';
  document.getElementById('step-done').classList.remove('active');
  document.getElementById('step-info').classList.add('active');
}

// Initialize
applyTheme();
</script>
</body>
</html>
