<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Registration Platform</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --brand: #0f766e; --brand-light: #14b8a6; --brand-dark: #0d5c56;
  --gold: #f59e0b; --bg: #f0fdfa; --card: #fff; --text: #1e293b; --border: #e2e8f0;
  --success: #10b981; --danger: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text);
  min-height: 100vh; transition: background 0.5s; background-size: cover; background-attachment: fixed; background-position: center;
}
.header {
  background: linear-gradient(135deg, var(--brand-dark), var(--brand)); color: #fff;
  padding: 30px 20px; text-align: center; position: relative;
}
.header-content { max-width: 800px; margin: 0 auto; }
.logo-circle {
  width: 90px; height: 90px; background: #fff; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 2.5rem;
  margin: 0 auto 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); overflow: hidden;
}
.logo-circle img { width: 100%; height: 100%; object-fit: cover; }
.header-info h1 { font-size: 2rem; margin-bottom: 5px; }
.header-info p { opacity: 0.9; font-size: 1.1rem; }

.container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
.card {
  background: var(--card); border-radius: 15px; padding: 30px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.06); margin-bottom: 25px; border: 1px solid var(--border);
}
.card h2 { color: var(--brand); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 3px solid var(--brand-light); font-size: 1.5rem; }

.form-group { margin-bottom: 20px; }
label { display: block; margin-bottom: 6px; font-weight: 600; color: #475569; font-size: 0.9rem; }
input, select {
  width: 100%; padding: 12px 15px; border: 2px solid var(--border); border-radius: 8px;
  font-family: inherit; font-size: 1rem; background: #fff; transition: all 0.3s;
}
input:focus, select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(15,118,110,0.1); }
input[readonly] { background: #f8fafc; color: #64748b; cursor: not-allowed; }

.btn {
  padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer;
  font-weight: 600; font-size: 1rem; transition: all 0.3s; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-dark); transform: translateY(-2px); }
.btn-success { background: var(--success); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-outline { background: transparent; border: 2px solid var(--brand); color: var(--brand); }
.btn-outline:hover { background: var(--brand); color: #fff; }
.btn-full { width: 100%; margin-top: 10px; }
.btn-sm { padding: 8px 14px; font-size: 0.85rem; }

.alert {
  padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; display: none; font-weight: 500;
}
.alert-success { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
.alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
.alert-warning { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }

.admin-toggle {
  position: fixed; bottom: 20px; right: 20px; background: var(--brand-dark); color: #fff;
  padding: 12px 20px; border-radius: 30px; cursor: pointer; font-weight: 600;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; border: none;
}

table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff; border-radius: 8px; overflow: hidden; }
th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
th { background: var(--brand); color: #fff; font-weight: 600; }
tr:hover { background: #f8fafc; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
.stat-card {
  background: linear-gradient(135deg, var(--brand), var(--brand-light)); color: #fff;
  padding: 20px; border-radius: 12px; text-align: center;
}
.stat-card .number { font-size: 2rem; font-weight: bold; margin-bottom: 5px; }
.stat-card .label { font-size: 0.9rem; opacity: 0.9; }

.hidden { display: none !important; }

@media(max-width: 768px) {
  .header-info h1 { font-size: 1.5rem; }
  .container { padding: 0 15px; }
  .card { padding: 20px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-content">
    <div class="logo-circle" id="app-logo">🏨</div>
    <div class="header-info">
      <h1 id="app-hotel-name">Event Registration</h1>
      <p id="app-tagline">Welcome to our exclusive event</p>
    </div>
  </div>
</div>

<div class="container">
  <div id="alert-success" class="alert alert-success"></div>
  <div id="alert-error" class="alert alert-error"></div>
  <div id="alert-warning" class="alert alert-warning"></div>

  <!-- EMPLOYEE REGISTRATION VIEW -->
  <div id="employee-view" class="card">
    <h2>📝 Event Registration</h2>
    <div style="background: #f0fdfa; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid var(--brand);">
      <p><strong>Event:</strong> <span id="display-event-name">Loading...</span></p>
      <p><strong>Date:</strong> <span id="display-event-date">Loading...</span></p>
      <p><strong>Available Seats:</strong> <span id="display-seats-left">Loading...</span></p>
    </div>
    
    <form id="registration-form" onsubmit="handleRegistration(event)">
      <div class="form-group">
        <label>Employee ID *</label>
        <input type="text" id="reg-empid" required placeholder="Enter your Employee ID">
      </div>
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" id="reg-name" required placeholder="Enter your full name">
      </div>
      <div class="form-group">
        <label>Department *</label>
        <select id="reg-dept" required>
          <option value="">Select Department</option>
          <option value="Executive Office">Executive Office</option>
          <option value="Front Office">Front Office</option>
          <option value="Human Resources">Human Resources</option>
          <option value="F&B Service">F&B Service</option>
          <option value="Kitchen">Kitchen</option>
          <option value="Housekeeping & Laundry">Housekeeping & Laundry</option>
          <option value="Security">Security</option>
          <option value="Sales & Marketing">Sales & Marketing</option>
          <option value="Engineering">Engineering</option>
          <option value="Finance & IT">Finance & IT</option>
        </select>
      </div>
      <div class="form-group">
        <label>Event Name</label>
        <input type="text" id="reg-event-name" readonly>
      </div>
      <div class="form-group">
        <label>Event Date</label>
        <input type="text" id="reg-event-date" readonly>
      </div>
      <button type="submit" class="btn btn-primary btn-full">✅ Register for Event</button>
    </form>
  </div>

  <!-- ADMIN DASHBOARD VIEW (Hidden by default) -->
  <div id="admin-view" class="hidden">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="number" id="stat-total-reg">0</div>
        <div class="label">Total Registrations</div>
      </div>
      <div class="stat-card" style="background: linear-gradient(135deg, var(--gold), #fbbf24);">
        <div class="number" id="stat-seats-left">0</div>
        <div class="label">Seats Remaining</div>
      </div>
    </div>

    <div class="card">
      <h2>⚙️ Event & Branding Settings</h2>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div class="form-group">
          <label>Event Name</label>
          <input type="text" id="admin-event-name" placeholder="e.g., Annual Gala 2026">
        </div>
        <div class="form-group">
          <label>Event Date</label>
          <input type="date" id="admin-event-date">
        </div>
        <div class="form-group">
          <label>Max Registrations Allowed</label>
          <input type="number" id="admin-max-reg" min="1" value="100">
        </div>
        <div class="form-group">
          <label>Hotel / Company Name</label>
          <input type="text" id="admin-hotel-name" placeholder="e.g., Six Senses">
        </div>
      </div>
      <div class="form-group">
        <label>Logo Image URL (or Base64)</label>
        <input type="text" id="admin-logo" placeholder="https://... or data:image/...">
      </div>
      <div class="form-group">
        <label>Background Image URL (or Base64)</label>
        <input type="text" id="admin-bg" placeholder="https://... or data:image/...">
      </div>
      <button class="btn btn-primary" onclick="saveAdminSettings()">💾 Save Settings</button>
    </div>

    <div class="card">
      <h2>📋 Registrations List</h2>
      <div style="margin-bottom: 15px; display: flex; gap: 10px;">
        <button class="btn btn-success" onclick="downloadExcelReport()">📥 Download Excel Report</button>
        <button class="btn btn-danger" onclick="clearAllRegistrations()">🗑️ Clear All Registrations</button>
      </div>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Employee ID</th>
              <th>Name</th>
              <th>Department</th>
              <th>Registration Time</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="registrations-tbody">
            <tr><td colspan="5" style="text-align:center; color:#94a3b8;">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<button class="admin-toggle" onclick="toggleAdmin()">⚙️ Admin Access</button>

<script>
// ==========================================
// 1. FIREBASE CONFIGURATION
// ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyBYjyLnyqqFlJef5E0zq3GfEhjLrMlEqDw",
  authDomain: "eventregistration-5832f.firebaseapp.com",
  projectId: "eventregistration-5832f",
  storageBucket: "eventregistration-5832f.firebasestorage.app",
  messagingSenderId: "847862523576",
  appId: "1:847862523576:web:d4a68ef53c1aef75f9364d",
  measurementId: "G-MYSFG9GXF5"
};

try {
  firebase.initializeApp(firebaseConfig);
  console.log('✅ Firebase initialized');
} catch(error) {
  console.error('❌ Firebase error:', error);
}

const db = firebase.database();
let isAdmin = false;
let currentSettings = {};
let registrationsList = [];

// ==========================================
// 2. REAL-TIME DATA LISTENERS
// ==========================================
// Listen to Event Settings
db.ref('event/settings').on('value', (snap) => {
  currentSettings = snap.val() || {
    eventName: 'Annual Company Event',
    eventDate: '2026-12-31',
    maxRegistrations: 100,
    hotelName: 'Event Registration',
    logo: '',
    background: ''
  };
  updateUI();
});

// Listen to Registrations
db.ref('event/registrations').on('value', (snap) => {
  const data = snap.val();
  registrationsList = data ? Object.entries(data).map(([id, val]) => ({id, ...val})) : [];
  updateStats();
  renderRegistrationsTable();
});

// ==========================================
// 3. UI UPDATE FUNCTIONS
// ==========================================
function updateUI() {
  // Update Employee View Displays
  document.getElementById('display-event-name').innerText = currentSettings.eventName;
  document.getElementById('display-event-date').innerText = currentSettings.eventDate;
  document.getElementById('reg-event-name').value = currentSettings.eventName;
  document.getElementById('reg-event-date').value = currentSettings.eventDate;
  
  // Update Admin Form Fields
  document.getElementById('admin-event-name').value = currentSettings.eventName;
  document.getElementById('admin-event-date').value = currentSettings.eventDate;
  document.getElementById('admin-max-reg').value = currentSettings.maxRegistrations;
  document.getElementById('admin-hotel-name').value = currentSettings.hotelName;
  document.getElementById('admin-logo').value = currentSettings.logo || '';
  document.getElementById('admin-bg').value = currentSettings.background || '';

  // Update Branding
  document.getElementById('app-hotel-name').innerText = currentSettings.hotelName || 'Event Registration';
  if (currentSettings.logo) {
    document.getElementById('app-logo').innerHTML = `<img src="${currentSettings.logo}" alt="Logo">`;
  }
  if (currentSettings.background) {
    document.body.style.backgroundImage = `url(${currentSettings.background})`;
  } else {
    document.body.style.backgroundImage = 'none';
  }
}

function updateStats() {
  const total = registrationsList.length;
  const max = parseInt(currentSettings.maxRegistrations) || 100;
  const left = Math.max(0, max - total);
  
  document.getElementById('stat-total-reg').innerText = total;
  document.getElementById('stat-seats-left').innerText = left;
  document.getElementById('display-seats-left').innerText = `${left} / ${max}`;
  
  if (left === 0) {
    document.getElementById('display-seats-left').style.color = 'var(--danger)';
    document.getElementById('display-seats-left').innerText = 'EVENT FULL';
  }
}

function renderRegistrationsTable() {
  const tbody = document.getElementById('registrations-tbody');
  if (registrationsList.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#94a3b8;">No registrations yet</td></tr>';
    return;
  }
  
  tbody.innerHTML = registrationsList.map(reg => `
    <tr>
      <td><strong>${reg.empId}</strong></td>
      <td>${reg.name}</td>
      <td>${reg.dept}</td>
      <td>${new Date(reg.timestamp).toLocaleString()}</td>
      <td><button class="btn btn-danger btn-sm" onclick="deleteRegistration('${reg.id}')">Remove</button></td>
    </tr>
  `).join('');
}

// ==========================================
// 4. EMPLOYEE ACTIONS
// ==========================================
function handleRegistration(e) {
  e.preventDefault();
  
  const empId = document.getElementById('reg-empid').value.trim().toUpperCase();
  const name = document.getElementById('reg-name').value.trim();
  const dept = document.getElementById('reg-dept').value;
  
  // Validation 1: Check capacity
  if (registrationsList.length >= parseInt(currentSettings.maxRegistrations)) {
    showAlert('Sorry, this event is already full.', 'error');
    return;
  }
  
  // Validation 2: Check duplicate
  const isDuplicate = registrationsList.some(r => r.empId === empId);
  if (isDuplicate) {
    showAlert('This Employee ID is already registered for this event.', 'error');
    return;
  }
  
  // Save to Firebase
  const newReg = {
    empId: empId,
    name: name,
    dept: dept,
    eventName: currentSettings.eventName,
    eventDate: currentSettings.eventDate,
    timestamp: Date.now()
  };
  
  db.ref('event/registrations').push(newReg).then(() => {
    showAlert('✅ Registration successful! See you at the event.', 'success');
    document.getElementById('registration-form').reset();
    // Re-fill readonly fields
    document.getElementById('reg-event-name').value = currentSettings.eventName;
    document.getElementById('reg-event-date').value = currentSettings.eventDate;
  }).catch(err => {
    showAlert('Error: ' + err.message, 'error');
  });
}

// ==========================================
// 5. ADMIN ACTIONS
// ==========================================
function toggleAdmin() {
  if (isAdmin) {
    isAdmin = false;
    document.getElementById('admin-view').classList.add('hidden');
    document.getElementById('employee-view').classList.remove('hidden');
    showAlert('Exited Admin Mode', 'info');
  } else {
    const pwd = prompt('Enter Admin Password:');
    if (pwd === 'Admin@2026') { // Change this password as needed
      isAdmin = true;
      document.getElementById('employee-view').classList.add('hidden');
      document.getElementById('admin-view').classList.remove('hidden');
      showAlert('✅ Admin Access Granted', 'success');
    } else if (pwd !== null) {
      showAlert('Invalid Password', 'error');
    }
  }
}

function saveAdminSettings() {
  const settings = {
    eventName: document.getElementById('admin-event-name').value.trim(),
    eventDate: document.getElementById('admin-event-date').value,
    maxRegistrations: parseInt(document.getElementById('admin-max-reg').value) || 100,
    hotelName: document.getElementById('admin-hotel-name').value.trim(),
    logo: document.getElementById('admin-logo').value.trim(),
    background: document.getElementById('admin-bg').value.trim()
  };
  
  db.ref('event/settings').set(settings).then(() => {
    showAlert('✅ Settings saved successfully!', 'success');
  }).catch(err => {
    showAlert('Error: ' + err.message, 'error');
  });
}

function deleteRegistration(id) {
  if (!confirm('Are you sure you want to remove this registration?')) return;
  db.ref('event/registrations/' + id).remove().then(() => {
    showAlert('Registration removed', 'success');
  });
}

function clearAllRegistrations() {
  if (!confirm('⚠️ WARNING: This will delete ALL registrations. Are you sure?')) return;
  db.ref('event/registrations').remove().then(() => {
    showAlert('All registrations cleared', 'success');
  });
}

function downloadExcelReport() {
  if (registrationsList.length === 0) {
    showAlert('No data to export', 'warning');
    return;
  }
  
  const exportData = registrationsList.map(r => ({
    'Employee ID': r.empId,
    'Full Name': r.name,
    'Department': r.dept,
    'Event Name': r.eventName,
    'Event Date': r.eventDate,
    'Registration Time': new Date(r.timestamp).toLocaleString()
  }));
  
  const ws = XLSX.utils.json_to_sheet(exportData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Registrations");
  
  const fileName = `Event_Registrations_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, fileName);
  showAlert('✅ Excel report downloaded!', 'success');
}

// ==========================================
// 6. UTILITIES
// ==========================================
function showAlert(msg, type) {
  // Hide all alerts first
  document.querySelectorAll('.alert').forEach(el => el.style.display = 'none');
  const el = document.getElementById('alert-' + type);
  if (el) {
    el.innerText = msg;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
  }
}
</script>
</body>
</html>
